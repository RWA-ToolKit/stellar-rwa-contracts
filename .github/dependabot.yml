version: 2
updates:
  # Rust / Cargo dependencies (issue #760)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Group minor and patch bumps into one PR per week so reviewers aren't
    # flooded with single-crate bump PRs.  Major bumps stay individual because
    # they may require code changes.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Respect the pins documented in Cargo.toml and fuzz/Cargo.toml (issue #710).
    ignore:
      # Major soroban-sdk bumps are manual: they can require contract changes.
      - dependency-name: "soroban-sdk"
        update-types: ["version-update:semver-major"]
      # Pinned to =2.2 in Cargo.toml: soroban-env-host for soroban-sdk 26 needs
      # ed25519-dalek 2.x. Dependabot's bump to 3.0 (#790) put 3.0 in
      # Cargo.lock, and soroban-env-host then failed to compile (a rand_core
      # CryptoRng mismatch), breaking every CI job. Lift this ignore together
      # with the pin, after a soroban-sdk release that supports dalek 3.
      - dependency-name: "ed25519-dalek"
      # Held at ~1.3 by soroban-sdk 26 (`arbitrary = "~1.3.0"`); a newer
      # version cannot resolve, as the 1.4 bump in fuzz/Cargo.toml showed.
      - dependency-name: "arbitrary"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(ci)"
