[workspace]
resolver = "2"
members = [
  "contracts/*",
  "fuzz",
]

# Minimum Supported Rust Version (MSRV) — issue #761.
# soroban-sdk 26 requires rustc 1.74+. We test against `channel = "stable"`
# in rust-toolchain.toml and document this floor here so downstream consumers
# (off-chain indexers, CLI tools) know the oldest compiler they can target.
[workspace.package]
rust-version = "1.74"

[workspace.dependencies]
soroban-sdk = "26"
# ed25519-dalek 2.2 is pinned: a newer major (2.3+) breaks the Soroban host's testutils.
# Future upgrades require testing against the Soroban SDK version + host environment.
ed25519-dalek = "=2.2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
