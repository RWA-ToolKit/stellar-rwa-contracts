[workspace]
resolver = "2"
members = [
  "contracts/*",
  "fuzz",
]

# cargo-audit configuration (issue #679). `cargo audit` reads this section
# automatically when run from the workspace root, so the CI job needs no extra
# flags. Accepted-risk advisories go in `ignore` below; anything not listed
# here fails the build.
[advisories]
# Fail on vulnerabilities and on unmaintained/yanked crates pulled in by the
# pinned dependency set; warnings are surfaced but do not fail the job.
vulnerability = "deny"
unmaintained = "warn"
yanked = "deny"
notice = "warn"
# Accepted risks. Each entry must name the advisory, the crate/version it
# applies to, why it is accepted, and when to re-check. Remove an entry as soon
# as the underlying constraint is lifted.
ignore = [
  # RUSTSEC-2024-0344: `curve25519-dalek` timing variability in the
  # `Scalar29`/`Scalar52` `sub` implementations. Reached only through
  # ed25519-dalek =2.2, which is pinned (see the comment below) because
  # soroban-sdk 26 / soroban-env-host 22.x links against that curve25519-dalek
  # version. Not exploitable here: contracts only verify signatures with public
  # inputs, never perform secret-scalar arithmetic on attacker-controlled
  # timings. Re-check on every soroban-sdk major bump and when the
  # ed25519-dalek pin is lifted (tracked with issue #753).
  "RUSTSEC-2024-0344",
]

[workspace.dependencies]
soroban-sdk = "26"
# ed25519-dalek 2.2 pin re-evaluated 2026-11-20 (issue #753).
# soroban-sdk 26 (soroban-env-host 22.x) still transitively pulls in ed25519-dalek
# via curve25519-dalek; bumping above 2.2 produces "conflicting versions of
# `curve25519-dalek`" at link time against the host testutils.  Pin kept at 2.2
# until soroban-sdk ships a release that resolves the curve25519-dalek version
# conflict.  Re-check with each soroban-sdk major bump.
ed25519-dalek = "=2.2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# release-with-logs (#725): the release build with `debug-assertions` on, so
# `log!`/debug output and debug_assert! checks are compiled in. It is for
# deploying a debug build to a local sandbox or testnet and reading its logs,
# so it deliberately keeps release's size settings: the Wasm still has to fit
# the network's contract size limit and behave like what ships.
#
# Measured 2026-11-22, all four contracts, wasm32v1-none:
#   this profile (opt-level z, lto, codegen-units 1): clean build 24 s;
#     asset_token 57,944 B, compliance 53,731, dividend 46,269, registry 43,934
#   opt-level 1, lto off, codegen-units 16:            clean build 30 s;
#     asset_token 63,442 B (+9.5%, within 2 KB of the 64 KiB limit), compliance
#     56,698, dividend 48,789, registry 48,300
#   Rebuild after editing a contract: under 0.5 s with either profile.
# The faster-compiling settings bought no build time here: the contract crates
# are small and a clean build is dominated by dependencies. They only grew
# the Wasm toward the size limit, so this profile keeps release's settings.
# For quick iteration without deploying, use `cargo test` (native, no Wasm).
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
