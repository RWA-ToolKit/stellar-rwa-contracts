[workspace]
resolver = "2"
members = [
  "contracts/*",
  "fuzz",
]

[workspace.dependencies]
soroban-sdk = "26"
# ed25519-dalek 2.2 is pinned: a newer major (2.3+) breaks the Soroban host's testutils.
# Future upgrades require testing against the Soroban SDK version + host environment.
ed25519-dalek = "=2.2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
