[package]
name = "dividend-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

# NOTE (issue #433): The previous Cargo.toml pinned soroban-sdk 21 while the
# workspace uses soroban-sdk 26 — two incompatible major versions that cannot
# be linked together.  It also declared a path dependency on
# ../contracts/dividend which imports soroban-sdk 26 from the workspace, so
# any fuzz code that imported both would link two incompatible Env types.
#
# Fix: pin soroban-sdk to the same version as the workspace (26), drop the
# path dependency on the dividend contract, and self-contain the arithmetic
# under test so no cross-crate Env handoff is required.  The fuzz target
# (`fuzz_targets/dividend_arithmetic.rs`) reproduces the on-chain formulas
# directly so the invariants are exercised without needing the Soroban host.

[dependencies]
# Match workspace soroban-sdk version so there is only one copy linked.
soroban-sdk = { version = "26" }
arbitrary = { version = "1.3", features = ["derive"] }
libfuzzer-sys = "0.4"

[[bin]]
name = "fuzz_dividend_arithmetic"
path = "fuzz_targets/dividend_arithmetic.rs"
