[package]
name = "rwa-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
compliance = { path = "../contracts/compliance", features = ["testutils"] }
soroban-sdk = { version = "26", features = ["testutils"] }
arbitrary = { version = "1.3", features = ["derive"] }

[[bin]]
name = "compliance_batch_allowlist"
path = "fuzz_targets/compliance_batch_allowlist.rs"

[[bin]]
name = "compliance_expiry"
path = "fuzz_targets/compliance_expiry.rs"

[[bin]]
name = "compliance_jurisdiction_race"
path = "fuzz_targets/compliance_jurisdiction_race.rs"

[[bin]]
name = "compliance_is_allowed"
path = "fuzz_targets/compliance_is_allowed.rs"
