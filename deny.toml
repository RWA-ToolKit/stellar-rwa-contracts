# Configuration for `cargo deny` (https://embarkstudios.github.io/cargo-deny/).
# Run locally with: cargo install cargo-deny --locked && cargo deny check

[graph]
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "wasm32v1-none" },
]

[advisories]
# Fail CI on known security vulnerabilities in the dependency graph.
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Allow the common permissive licenses used throughout the Rust ecosystem.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
]
confidence-threshold = 0.8

[bans]
# Multiple versions of the same crate are common in the Rust ecosystem and
# not worth failing CI over; just warn so they're visible.
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
