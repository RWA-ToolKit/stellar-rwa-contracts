[package]
name = "dividend"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
common = { path = "../common" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Used only in tests: a real asset token (for holder balances / supply) and
# the compliance contract it depends on.
compliance = { path = "../compliance", features = ["testutils"] }
asset-token = { path = "../asset-token", features = ["testutils"] }
