[package]
name = "registry"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Required by the cross-contract admin-verification tests (#10).
asset-token = { path = "../asset-token", features = ["testutils"] }
compliance = { path = "../compliance", features = ["testutils"] }
